name: Release

on:
  push:
    tags:
      - "v*-custom.*"

permissions:
  contents: read

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  NPM_CONFIG_REGISTRY: https://registry.npmmirror.com

jobs:
  prepare:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      release-draft: ${{ steps.release.outputs.draft }}
    steps:
      - uses: actions/checkout@v5

      - name: Validate tag and versions
        shell: bash
        run: |
          set -euo pipefail
          version="${GITHUB_REF_NAME#v}"
          if [[ ! "${version}" =~ ^([0-9]+\.[0-9]+\.[0-9]+)-custom\.([1-9][0-9]*)$ ]]; then
            echo "Tag ${GITHUB_REF_NAME} must use v<upstream-version>-custom.<revision> (for example, v0.8.2-custom.1)."
            exit 1
          fi
          source_version="${BASH_REMATCH[1]}"
          package_version="$(node -p "require('./package.json').version")"
          tauri_version="$(node -p "require('./src-tauri/tauri.conf.json').version")"
          cargo_version="$(sed -n 's/^version = "\([^"]*\)"/\1/p' src-tauri/Cargo.toml | head -n 1)"
          if [[ "${source_version}" != "${package_version}" || "${source_version}" != "${tauri_version}" || "${source_version}" != "${cargo_version}" ]]; then
            echo "Tag ${GITHUB_REF_NAME} does not match package (${package_version}), Tauri (${tauri_version}), and Cargo (${cargo_version}) versions."
            exit 1
          fi

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Verify web build
        run: |
          npm ci
          npm run build

      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail
          if gh release view "${GITHUB_REF_NAME}" >/dev/null 2>&1; then
            draft="$(gh release view "${GITHUB_REF_NAME}" --json isDraft --jq .isDraft)"
          else
            gh release create "${GITHUB_REF_NAME}" --verify-tag --draft --generate-notes --title "${GITHUB_REF_NAME}"
            draft=true
          fi
          echo "draft=${draft}" >> "${GITHUB_OUTPUT}"

  build:
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-latest
            target: aarch64-apple-darwin
            bundles: dmg
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            bundles: nsis
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: src-tauri

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npx tsc --noEmit

      # ort 静态链进来的 ONNX Runtime 是 /MD 编的；在上传安装包前确认 VC++ DLL 齐全。
      - name: Verify bundled VC++ runtime
        if: matrix.os == 'windows-latest'
        run: |
          npm run build
          node scripts/win-crt.mjs
          cargo build --release --manifest-path src-tauri/Cargo.toml --target ${{ matrix.target }}
          node scripts/win-crt.mjs --verify=src-tauri/target/${{ matrix.target }}/release/dolce.exe

      - name: Build and upload installers
        uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseDraft: ${{ needs.prepare.outputs.release-draft }}
          args: --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

  pages-build:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5

      - name: Setup Node
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Build web app
        run: |
          npm ci
          npm run build
        env:
          BASE_PATH: /dolce/

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: out/dist

  pages-deploy:
    needs: pages-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5

  publish:
    needs: [build, pages-deploy]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Publish release after all artifacts succeed
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: gh release edit "${GITHUB_REF_NAME}" --draft=false
